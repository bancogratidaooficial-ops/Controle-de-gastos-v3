<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G GRATIDÃO V86 GASTOS</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263470788888608" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:15px;overflow-y:auto}
h1{text-align:center;color:#ffcc00;margin:10px 0;font-size:24px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:15px 0}
.card{background:#1a1a1a;border-radius:12px;padding:10px;text-align:center;border:1px solid #333}
.card b{display:block;font-size:11px;color:#aaa}
.card span{font-size:15px;font-weight:bold}
.entrada{color:#00ff88}.saida{color:#ff4444}.saldo{color:#ffcc00}
.box{background:#1a1a1a;border-radius:12px;padding:15px;margin:15px 0;border:1px solid #333}
.box h3{color:#ffcc00;margin-bottom:10px}
input,select,button{width:100%;padding:14px;border-radius:10px;border:none;margin:7px 0;font-size:16px;display:block}
input,select{background:#2a2a2a;color:#fff;border:1px solid #555}
button{background:#ffcc00;color:#000;font-weight:bold}
.lista{max-height:350px;overflow-y:auto}
.item{display:flex;justify-content:space-between;padding:12px 5px;border-bottom:1px solid #222}
.badge{padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-entrada{background:#00ff8822;color:#00ff88}.badge-saida{background:#ff444422;color:#ff4444}
.export{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0 80px 0}
.export button{background:#333;color:#fff;border:1px solid #555}
canvas{background:#111;border-radius:10px;padding:10px;margin-top:10px}
.ad-box{background:#111;border:1px dashed #ffcc00;border-radius:10px;padding:5px;margin:15px 0;text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body>
<h1>G GRATIDÃO V86 GASTOS</h1>
<div class="cards">
<div class="card"><b>ENTRADAS</b><span class="entrada" id="totalEntrada">R$ 0</span></div>
<div class="card"><b>SAÍDAS</b><span class="saida" id="totalSaida">R$ 0</span></div>
<div class="card"><b>SALDO</b><span class="saldo" id="totalSaldo">R$ 0</span></div>
</div>
<div class="box">
<h3>+ Novo Lançamento</h3>
<select id="tipo"><option value="saida">SAÍDA - Gastei</option><option value="entrada">ENTRADA - Recebi</option></select>
<input id="desc" placeholder="O que foi?">
<input id="valor" type="number" step="0.01" placeholder="Valor R$">
<select id="cat" onchange="checkCat()"></select>
<div id="novaCatBox" style="display:none"><input id="novaCat" placeholder="Nova categoria"><button onclick="addCat()" style="background:#555;color:#fff">Adicionar</button></div>
<button onclick="add()">SALVAR LANÇAMENTO</button>
</div>

<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2263470788888608" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="box">
<h3>📊 Onde tô gastando mais?</h3>
<canvas id="grafico" height="200"></canvas>
</div>

<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2263470788888608" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="box">
<h3>📋 Planilha de Gastos</h3>
<div class="lista" id="lista"></div>
</div>
<div class="export">
<button onclick="exportCSV()">📊 Exportar p/ Sheets</button>
<button onclick="limpar()">🗑️ Zerar Mês</button>
</div>
<script>
let dados = JSON.parse(localStorage.getItem('v86gastos_v2')||'[]');
let cats = JSON.parse(localStorage.getItem('v86cats')||'null') || ["Mercado","Farmácia","Combustível","Aluguel","Alimentação","Transporte","Luz/Água/Internet","Lazer","Saúde","Trabalho"];
let chart;
function salvar(){localStorage.setItem('v86gastos_v2',JSON.stringify(dados)); localStorage.setItem('v86cats',JSON.stringify(cats)); render();}
function checkCat(){document.getElementById('novaCatBox').style.display = document.getElementById('cat').value==='__outro'?'block':'none';}
function addCat(){let n=document.getElementById('novaCat').value.trim(); if(!n) return; if(!cats.includes(n)) cats.push(n); document.getElementById('novaCat').value=''; document.getElementById('novaCatBox').style.display='none'; render();}
function renderCats(){let sel=document.getElementById('cat'); sel.innerHTML=''; cats.forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`}); sel.innerHTML+=`<option value="__outro">+ Adicionar outro...</option>`;}
function add(){let d=document.getElementById('desc').value.trim(); let v=parseFloat(document.getElementById('valor').value); let t=document.getElementById('tipo').value; let c=document.getElementById('cat').value; if(c==='__outro'){alert('Crie a categoria');return;} if(!d||isNaN(v)){alert('Preencha tudo!');return;} dados.unshift({id:Date.now(),desc:d,valor:v,tipo:t,cat:c,data:new Date().toLocaleDateString('pt-BR')}); document.getElementById('desc').value='';document.getElementById('valor').value=''; salvar();}
function del(id){if(confirm('Excluir?')){dados=dados.filter(x=>x.id!==id); salvar();}}
function render(){let e=0,s=0;let html='';let porCat={}; dados.forEach(x=>{if(x.tipo==='entrada') e+=x.valor; else {s+=x.valor; porCat[x.cat]=(porCat[x.cat]||0)+x.valor;} html+=`<div class="item"><div><b>${x.desc}</b><br><small>${x.data} • ${x.cat}</small></div><div style="text-align:right"><span class="badge ${x.tipo==='entrada'?'badge-entrada':'badge-saida'}">${x.tipo==='entrada'?'+':'-'} R$ ${x.valor.toFixed(2)}</span><br><small onclick="del(${x.id})" style="color:#ff4444;cursor:pointer">excluir</small></div></div>`;}); document.getElementById('totalEntrada').innerText='R$ '+e.toFixed(2); document.getElementById('totalSaida').innerText='R$ '+s.toFixed(2); document.getElementById('totalSaldo').innerText='R$ '+(e-s).toFixed(2); document.getElementById('lista').innerHTML=html||'<p style="text-align:center;color:#666;padding:15px">Nada ainda</p>'; let labels=Object.keys(porCat);let valores=Object.values(porCat); let ctx=document.getElementById('grafico').getContext('2d'); if(chart) chart.destroy(); if(labels.length===0){ctx.clearRect(0,0,300,200); ctx.fillStyle='#666'; ctx.textAlign='center'; ctx.fillText('Adicione gastos',150,100); return;} chart=new Chart(ctx,{type:'doughnut',data:{labels:labels,datasets:[{data:valores,backgroundColor:['#ffcc00','#00ff88','#ff4444','#4488ff','#ff88cc','#88ff44','#ff8800','#aa44ff','#44ffff','#ffaa44']}]},options:{plugins:{legend:{labels:{color:'#fff'}}}}});}
function exportCSV(){if(!dados.length){alert('Nada');return;} let csv='Data,Descricao,Tipo,Categoria,Valor\n'; dados.forEach(x=>{csv+=`${x.data},"${x.desc}",${x.tipo},${x.cat},${x.valor}\n`;}); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v86-gastos.csv';a.click();}
function limpar(){if(confirm('Zerar tudo?')){dados=[];salvar();}}
renderCats();render();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
</script>
</body>
</html>
