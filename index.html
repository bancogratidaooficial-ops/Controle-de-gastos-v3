<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 GASTOS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;padding-bottom:20px}
.topo{background:#000;color:#FFD700;padding:20px;text-align:center}
.saldo-card{background:white;margin:-20px 15px 15px 15px;padding:20px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center}
.saldo-valor{font-size:32px;font-weight:bold;color:#000}
.entrada{margin:15px;background:white;padding:15px;border-radius:12px;display:flex;gap:10px}
.entrada input{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.btn-add{background:#000;color:#FFD700;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;font-size:18px}
.lista{margin:15px}
.item{background:white;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.item span{font-size:14px;color:#666}
</style>
</head>
<body>
<div class="topo">
<h1>V86 GASTOS 💰</h1>
<p>Tenha controle em seus gastos</p>
</div>

<div class="saldo-card">
<p>Saldo Restante</p>
<div class="saldo-valor" id="saldo">R$ 1000,00</div>
<p style="margin-top:5px;font-size:12px;color:#888">Total gasto: <span id="totalGasto">R$ 0,00</span></p>
</div>

<div class="entrada">
<input type="text" id="nomeGasto" placeholder="Ex: Mercado">
<input type="number" id="valorGasto" placeholder="R$">
<button class="btn-add" onclick="adicionarGasto()">+</button>
</div>

<div class="lista" id="listaGastos"></div>

<button id="btnInstalar" style="display:none; width: calc(100% - 30px); margin: 0 15px 15px 15px; padding: 14px; background: #ffcc00; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px;">
  📲 Instalar App no Celular
</button>

<div style="background: linear-gradient(135deg, #FFD700, #FFA500); margin: 15px; padding: 20px; border-radius: 16px; text-align: center;">
  <h3 style="margin:0 0 10px 0;">Gostou do controle? 💰</h3>
  <p style="margin:0 0 15px 0;">Compartilhe com amigos e família!</p>
  <button onclick="compartilharAppGeral()" style="width: 100%; padding: 12px; margin-bottom: 10px; background: #25D366; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px;">
    💚 Compartilhar no WhatsApp
  </button>
  <button onclick="compartilharAppGeral()" style="width: 100%; padding: 12px; background: #000; color: #FFD700; border: none; border-radius: 10px; font-weight: bold; font-size: 15px;">
    👥 Convidar Amigo
  </button>
</div>

<script>
let gastos = JSON.parse(localStorage.getItem('v86_gastos')) || [];
let saldoInicial = 1000;
function salvar() {
  localStorage.setItem('v86_gastos', JSON.stringify(gastos));
  atualizarTela();
}
function adicionarGasto() {
  const nome = document.getElementById('nomeGasto').value;
  const valor = parseFloat(document.getElementById('valorGasto').value);
  if (!nome || !valor) return alert('Preencha nome e valor!');
  gastos.push({nome, valor, data: new Date().toLocaleDateString()});
  document.getElementById('nomeGasto').value = '';
  document.getElementById('valorGasto').value = '';
  salvar();
}
function remover(index) {
  gastos.splice(index, 1);
  salvar();
}
function atualizarTela() {
  const lista = document.getElementById('listaGastos');
  const total = gastos.reduce((s, g) => s + g.valor, 0);
  const resto = saldoInicial - total;
  document.getElementById('totalGasto').innerText = 'R$ ' + total.toFixed(2).replace('.', ',');
  document.getElementById('saldo').innerText = 'R$ ' + resto.toFixed(2).replace('.', ',');
  lista.innerHTML = '';
  gastos.slice().reverse().forEach((g, i) => {
    const idx = gastos.length - 1 - i;
    lista.innerHTML += '<div class="item"><div><b>' + g.nome + '</b><br><span>' + g.data + '</span></div><div style="text-align:right"><b style="color:red">- R$ ' + g.valor.toFixed(2).replace('.', ',') + '</b><br><span onclick="remover(' + idx + ')" style="color:#888;cursor:pointer">remover</span></div></div>';
  });
}
atualizarTela();

let appParaInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  appParaInstalar = e;
  document.getElementById('btnInstalar').style.display = 'block';
});
document.getElementById('btnInstalar').addEventListener('click', async () => {
  if (!appParaInstalar) return;
  appParaInstalar.prompt();
  const escolha = await appParaInstalar.userChoice;
  if (escolha.outcome === 'accepted') {
    document.getElementById('btnInstalar').style.display = 'none';
  }
  appParaInstalar = null;
});
function compartilharAppGeral() {
  const url = window.location.href;
  const texto = 'Tenha controle em seus gastos! Estou usando o V86 GASTOS e é top demais: ';
  if (navigator.share) {
    navigator.share({ title: 'V86 GASTOS', text: texto, url: url });
  } else {
    const mensagem = encodeURIComponent(texto + url);
    window.open('https://wa.me/?text=' + mensagem, '_blank');
  }
}
</script>
</body>
</html>
